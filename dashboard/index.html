<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.U.R.A.J.</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #050300; color: #fff; }
        .scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        .bg-sun {
            position: absolute; top: 50%; left: -8vw;
            transform: translateY(-50%) scaleX(-1);
            height: 130vh; width: auto; object-fit: cover;
            opacity: 0.85; pointer-events: none;
            animation: breathe 8s ease-in-out infinite;
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(ellipse 70% 70% at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }
        @keyframes breathe {
            0%,100% { opacity: 0.75; transform: translateY(-50%) scaleX(-1) scale(1); }
            50%      { opacity: 0.9;  transform: translateY(-50%) scaleX(-1) scale(1.03); }
        }
        .bg-fade {
            position: absolute; inset: 0;
            background: linear-gradient(to right, transparent 0%, rgba(5,3,0,0.3) 30%, rgba(5,3,0,0.75) 55%, rgba(5,3,0,0.97) 75%, #050300 100%);
        }
        .bg-vfade {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, #050300 0%, transparent 15%, transparent 85%, #050300 100%);
        }
        .content {
            position: absolute; right: 18vw; top: 40%; transform: translateY(-50%);
            max-width: 480px; display: flex; flex-direction: column; gap: 2rem;
            opacity: 0; animation: fadeUp 1.2s ease forwards 0.4s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(calc(-50% + 30px)); }
            to   { opacity: 1; transform: translateY(-50%); }
        }
        .title { font-family: 'Orbitron', sans-serif; font-size: clamp(3.5rem,7vw,6rem); font-weight: 900; letter-spacing: 0.5rem; line-height: 1; color: rgba(180,120,20,0.95); text-shadow: none; }
        .full-form { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 0.15rem; color: #ffffff; text-transform: uppercase; margin-top: -1.5rem; }
        .tagline { font-size: clamp(0.9rem,1.5vw,1.05rem); font-weight: 300; color: rgba(255,255,255,0.45); line-height: 1.9; max-width: 380px; }
        .tagline strong { color: rgba(255,200,80,0.9); font-weight: 500; }
        .divider { width: 48px; height: 1px; background: rgba(255,160,30,0.35); }
        .stats-row { display: flex; gap: 2.5rem; }
        .stat { display: flex; flex-direction: column; gap: 0.3rem; }
        .stat-num { font-family: 'Orbitron', sans-serif; font-size: 1.35rem; font-weight: 600; color: rgba(255,200,80,0.9); }
        .stat-label { font-size: 0.68rem; letter-spacing: 0.12rem; text-transform: uppercase; color: rgba(255,255,255,0.3); }
        .cta-row { display: flex; align-items: center; gap: 1.5rem; margin-top: 0.5rem; }
        .btn-start {
            display: inline-flex; align-items: center; gap: 0.75rem;
            padding: 0.85rem 2rem;
            background: rgba(255,150,30,0.1); border: 1px solid rgba(255,150,30,0.4);
            border-radius: 50px; color: rgba(255,210,100,0.95);
            font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 600;
            letter-spacing: 0.15rem; text-transform: uppercase; text-decoration: none;
            cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .btn-start::before { content: ''; position: absolute; inset: 0; background: rgba(255,150,30,0.08); transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; border-radius: inherit; }
        .btn-start:hover::before { transform: scaleX(1); }
        .btn-start:hover { border-color: rgba(255,180,60,0.7); color: #fff; box-shadow: 0 0 30px rgba(255,130,0,0.2); }
        .btn-arrow { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,180,60,0.4); border-radius: 50%; transition: transform 0.3s; }
        .btn-start:hover .btn-arrow { transform: translateX(3px); }
        .btn-arrow svg { width: 8px; height: 8px; }
        .learn-more { font-size: 0.72rem; letter-spacing: 0.1rem; color: rgba(255,255,255,0.25); text-transform: uppercase; }
        .corner-nav { position: absolute; top: 2rem; left: 2.5rem; display: flex; align-items: center; gap: 1rem; opacity: 0; animation: fadeIn 1s ease forwards 1s; }
        .corner-action { position: absolute; top: 1.5rem; right: 2.5rem; z-index: 10; opacity: 0; animation: fadeIn 1s ease forwards 1s; }
        @keyframes fadeIn { to { opacity: 1; } }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.25rem; color: rgba(255,200,80,0.55); }
        .nav-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.1); }
        .nav-link { font-size: 0.68rem; letter-spacing: 0.1rem; color: #ffffff; text-transform: uppercase; text-decoration: none; transition: color 0.2s; }
        .nav-link:hover { color: rgba(255,200,80,0.8); }
        .bottom-strip { position: absolute; bottom: 2rem; right: 7vw; display: flex; align-items: center; gap: 2rem; opacity: 0; animation: fadeIn 1s ease forwards 1.5s; }
        .bottom-tag { font-size: 0.62rem; letter-spacing: 0.15rem; text-transform: uppercase; color: rgba(255,255,255,0.18); display: flex; align-items: center; gap: 0.5rem; }
        .bottom-tag::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: rgba(255,160,30,0.45); }
        .scroll-indicator { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.5rem; opacity: 0; animation: fadeIn 1s ease forwards 2s, scrollPulse 2s ease-in-out 2s infinite; cursor: pointer; color: #ffffff; transition: opacity 0.3s; }
        .scroll-indicator:hover { opacity: 0.8; }
        .scroll-text { font-size: 0.65rem; letter-spacing: 0.2rem; text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
        .scroll-arrow { width: 14px; height: 14px; }
        @keyframes scrollPulse { 0%,100%{transform:translateX(-50%) translateY(0);opacity:0.7} 50%{transform:translateX(-50%) translateY(6px);opacity:1} }
        .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: rgba(255,180,50,0.55); animation: float var(--dur) ease-in-out infinite var(--delay); }
        @keyframes float { 0%,100%{transform:translateY(0) translateX(0);opacity:0} 20%{opacity:1} 80%{opacity:0.4} 100%{transform:translateY(-120px) translateX(var(--dx));opacity:0} }
        @media (max-width: 700px) {
            .bg-sun { left: -40vw; height: 100vh; }
            .content { right: 5vw; left: 5vw; max-width: 100%; }
            .stats-row { gap: 1.5rem; }
            .bottom-strip { display: none; }
        }
    </style>
</head>
<body>
<div class="scene">
    <img class="bg-sun" src="assets/sun_bg.jfif" alt="">
    <div class="bg-fade"></div>
    <div class="bg-vfade"></div>
    <div class="particles" id="particles"></div>
    <nav class="corner-nav">
        <span class="nav-logo">S.U.R.A.J.</span>
        <div class="nav-sep"></div>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
    </nav>
    <div class="corner-action">
        <a href="dashboard.html" class="btn-start">Get Started<span class="btn-arrow"><svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4h6M4 1l3 3-3 3"/></svg></span></a>
    </div>
    <div class="content">
        <h1 class="title">S.U.R.A.J.</h1>
        <div class="full-form">Solar Utility & Radiance Analytical Judgment</div>

    </div>

    <div class="scroll-indicator">
        <span class="scroll-text">Details</span>
        <svg class="scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
</div>
<script>
const c = document.getElementById('particles');
for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = 'left:' + (Math.random()*60+5) + '%;bottom:' + (Math.random()*40) + '%;--dur:' + (4+Math.random()*6) + 's;--delay:-' + (Math.random()*6) + 's;--dx:' + (Math.random()*40-20) + 'px';
    c.appendChild(p);
}
</script>
</body>
</html>
